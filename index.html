<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Fotoboard</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    color: #eee;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging, #stage.dragging .photo { cursor: grabbing; }
  #world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #world.ready { opacity: 1; }
  .photo {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--size);
    height: var(--size);
    background: #111;
    cursor: zoom-in;
  }
  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .photo.missing img { visibility: hidden; }

  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.94);
    touch-action: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    --gx: clamp(12px, 6vw, 88px);
    --gy: clamp(12px, 5vh, 56px);
  }
  #lightbox[hidden] { display: none; }
  #lightbox.open { opacity: 1; }
  #lb-img {
    display: block;
    width: min(calc(100vw - 2 * var(--gx)), calc((100vh - 2 * var(--gy)) * var(--ar, 1)));
    width: min(calc(100vw - 2 * var(--gx)), calc((100dvh - 2 * var(--gy)) * var(--ar, 1)));
    height: auto;
    aspect-ratio: var(--ar, 1);
    object-fit: contain;
    -webkit-user-drag: none;
  }
  #lb-img.settle { transition: transform 0.2s ease, opacity 0.2s ease; }
  .lb-btn {
    position: absolute;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(32, 32, 32, 0.72);
    color: #fff;
    cursor: pointer;
  }
  .lb-btn:hover { background: rgba(64, 64, 64, 0.85); }
  .lb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lb-btn svg { width: 24px; height: 24px; }
  #lb-prev { left: max(8px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
  #lb-next { right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
  #lb-close { right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); }
  #lb-count {
    position: absolute;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    color: #a8a8a8;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto" hidden>
  <img id="lb-img" alt="">
  <button class="lb-btn" id="lb-prev" type="button" aria-label="Vorheriges Foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-btn" id="lb-next" type="button" aria-label="Nächstes Foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="lb-btn" id="lb-close" type="button" aria-label="Schliessen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="lb-count" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';
  const LAYOUT = {"size":300,"items":[{"name":"IMG_4694.jpeg","x":-400,"y":1640,"rot":0,"z":1},{"name":"IMG_4631.jpeg","x":-400,"y":1320,"rot":0,"z":2},{"name":"IMG_4710.jpeg","x":-80,"y":1640,"rot":0,"z":3},{"name":"IMG_4778.jpeg","x":-80,"y":1320,"rot":0,"z":4},{"name":"IMG_4664.jpeg","x":-400,"y":2140,"rot":0,"z":5},{"name":"IMG_4618.jpeg","x":-80,"y":2140,"rot":0,"z":6},{"name":"IMG_4766.jpeg","x":-400,"y":2460,"rot":0,"z":7},{"name":"DSC04047.jpeg","x":-80,"y":2460,"rot":0,"z":8},{"name":"IMG_4718.jpeg","x":340,"y":2140,"rot":0,"z":9},{"name":"IMG_4723.jpeg","x":660,"y":2140,"rot":0,"z":10},{"name":"IMG_4596.jpeg","x":340,"y":2460,"rot":0,"z":11},{"name":"IMG_4651.jpeg","x":660,"y":2460,"rot":0,"z":12},{"name":"IMG_4729.jpeg","x":1100,"y":1300,"rot":0,"z":13},{"name":"IMG_4685.jpeg","x":1100,"y":1620,"rot":0,"z":14},{"name":"IMG_4734.jpeg","x":1420,"y":1300,"rot":0,"z":15},{"name":"IMG_4712.jpeg","x":1420,"y":1620,"rot":90,"z":16},{"name":"IMG_4601.jpeg","x":1100,"y":2140,"rot":0,"z":17},{"name":"IMG_4726.jpeg","x":1420,"y":2140,"rot":0,"z":18},{"name":"IMG_4589.jpeg","x":1100,"y":2460,"rot":0,"z":19},{"name":"IMG_4731.jpeg","x":1420,"y":2460,"rot":0,"z":20},{"name":"IMG_4689.jpeg","x":-400,"y":2860,"rot":0,"z":21},{"name":"IMG_4686.jpeg","x":-80,"y":2860,"rot":0,"z":22},{"name":"IMG_4629.jpeg","x":-400,"y":3180,"rot":0,"z":23},{"name":"IMG_4628.jpeg","x":-80,"y":3180,"rot":0,"z":24},{"name":"IMG_4934.jpeg","x":340,"y":2860,"rot":0,"z":25},{"name":"IMG_4693.jpeg","x":660,"y":2860,"rot":0,"z":26},{"name":"IMG_4676.jpeg","x":340,"y":3180,"rot":0,"z":27},{"name":"IMG_4646.jpeg","x":660,"y":3180,"rot":0,"z":28},{"name":"IMG_4594.jpeg","x":1100,"y":2860,"rot":0,"z":29},{"name":"IMG_4626.jpeg","x":1100,"y":3180,"rot":0,"z":30},{"name":"DSC03911.jpeg","x":1420,"y":3180,"rot":0,"z":31},{"name":"IMG_4663.jpeg","x":1420,"y":2860,"rot":0,"z":32},{"name":"DSC04065.jpeg","x":340,"y":1640,"rot":0,"z":33},{"name":"_DSC2247.jpeg","x":340,"y":1320,"rot":0,"z":34},{"name":"DSC03874.jpeg","x":660,"y":1640,"rot":0,"z":35},{"name":"_DSC2258.jpeg","x":660,"y":1320,"rot":0,"z":36},{"name":"DSC04084.jpeg","x":1900,"y":1740,"rot":0,"z":37},{"name":"DSC04027.jpeg","x":2220,"y":1740,"rot":0,"z":38},{"name":"DSC04040.jpeg","x":1900,"y":2060,"rot":0,"z":39},{"name":"DSC04038.jpeg","x":2220,"y":2060,"rot":0,"z":40}]};

  const S = LAYOUT.size || 300;
  const items = LAYOUT.items.slice().sort((a, b) => a.z - b.z);
  const TAP = 8;            // ab so vielen Pixeln gilt ein Druck als Ziehen
  const MAX_SCALE = 4;

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const src = (dir, name) => 'fotos/' + dir + '/' + encodeURIComponent(name);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  world.style.setProperty('--size', S + 'px');

  const tiles = items.map((it, i) => {
    const tile = document.createElement('div');
    tile.className = 'photo';
    tile.dataset.i = i;
    tile.style.transform = 'translate(' + it.x + 'px, ' + it.y + 'px) rotate(' + (it.rot || 0) + 'deg)';
    tile.style.zIndex = i + 1;
    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.decoding = 'async';
    img.addEventListener('error', () => tile.classList.add('missing'), { once: true });
    img.src = src('board', it.name);
    tile.append(img);
    world.append(tile);
    return tile;
  });

  // Umriss aller Fotos, gedrehte Fotos mitgerechnet
  const box = (() => {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const it of items) {
      const r = (it.rot || 0) * Math.PI / 180;
      const h = S / 2 * (Math.abs(Math.cos(r)) + Math.abs(Math.sin(r)));
      const cx = it.x + S / 2, cy = it.y + S / 2;
      minX = Math.min(minX, cx - h); maxX = Math.max(maxX, cx + h);
      minY = Math.min(minY, cy - h); maxY = Math.max(maxY, cy + h);
    }
    return items.length ? { minX, minY, maxX, maxY } : { minX: 0, minY: 0, maxX: S, maxY: S };
  })();

  // ---------- Ansicht: verschieben und zoomen ----------
  const view = { x: 0, y: 0, s: 1 };
  let minScale = 0.05;
  let touched = false;

  function apply() {
    world.style.transform = 'translate(' + view.x + 'px, ' + view.y + 'px) scale(' + view.s + ')';
  }

  // Die Bildschirmmitte bleibt immer über dem Board, so geht es nie verloren.
  function keepInside() {
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    view.x = clamp(view.x, cx - box.maxX * view.s, cx - box.minX * view.s);
    view.y = clamp(view.y, cy - box.maxY * view.s, cy - box.minY * view.s);
  }

  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const pad = Math.round(Math.min(w, h) * 0.04) + 12;
    const bw = box.maxX - box.minX, bh = box.maxY - box.minY;
    const s = Math.min((w - 2 * pad) / bw, (h - 2 * pad) / bh, 2);
    minScale = Math.min(s * 0.5, 1);
    view.s = s;
    view.x = (w - bw * s) / 2 - box.minX * s;
    view.y = (h - bh * s) / 2 - box.minY * s;
    apply();
  }

  function zoomAt(cx, cy, s) {
    s = clamp(s, minScale, MAX_SCALE);
    const k = s / view.s;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.s = s;
    keepInside();
    apply();
  }

  const pts = new Map();
  let g = null;

  function startPinch() {
    const [a, b] = [...pts.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    g = {
      type: 'pinch',
      d0: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      s0: view.s,
      wx: (mx - view.x) / view.s,
      wy: (my - view.y) / view.s,
    };
  }

  function startPan(id, x, y, moved, photo) {
    g = { type: 'pan', id, sx: x, sy: y, vx: view.x, vy: view.y, moved, photo };
  }

  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touched = true;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      const tile = e.target.closest('.photo');
      startPan(e.pointerId, e.clientX, e.clientY, false, tile ? +tile.dataset.i : -1);
    } else if (pts.size === 2) {
      startPinch();
    }
  });

  stage.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p || !g) return;
    p.x = e.clientX;
    p.y = e.clientY;
    if (g.type === 'pan' && e.pointerId === g.id) {
      const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
      if (!g.moved && Math.hypot(dx, dy) < TAP) return;
      if (!g.moved) { g.moved = true; stage.classList.add('dragging'); }
      view.x = g.vx + dx;
      view.y = g.vy + dy;
      keepInside();
      apply();
    } else if (g.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const s = clamp(g.s0 * Math.hypot(b.x - a.x, b.y - a.y) / g.d0, minScale, MAX_SCALE);
      view.s = s;
      view.x = mx - g.wx * s;
      view.y = my - g.wy * s;
      keepInside();
      apply();
    }
  });

  function pointerEnd(e) {
    if (!pts.delete(e.pointerId) || !g) return;
    if (g.type === 'pan' && g.id === e.pointerId) {
      if (!g.moved && e.type === 'pointerup' && g.photo >= 0) openLightbox(g.photo);
      stage.classList.remove('dragging');
      g = null;
    } else if (g.type === 'pinch') {
      if (pts.size >= 2) startPinch();
      else if (pts.size === 1) {
        const [[id, p]] = pts;
        startPan(id, p.x, p.y, true, -1);
      } else g = null;
    }
  }
  stage.addEventListener('pointerup', pointerEnd);
  stage.addEventListener('pointercancel', pointerEnd);

  // Mausrad und Trackpad. Pinch auf dem Trackpad kommt als Rad mit ctrlKey.
  let gestureScale = null;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey && gestureScale !== null) return;
    touched = true;
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1;
    const k = e.ctrlKey ? 0.01 : 0.002;
    zoomAt(e.clientX, e.clientY, view.s * Math.exp(-e.deltaY * unit * k));
  }, { passive: false });

  // Seitenzoom überall verhindern (Strg+Rad, Safari-Gesten)
  window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => {
    e.preventDefault();
    gestureScale = pts.size < 2 && lb.hidden ? view.s : null;
  });
  document.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    if (gestureScale === null || pts.size >= 2) return;
    touched = true;
    const x = e.clientX ?? stage.clientWidth / 2, y = e.clientY ?? stage.clientHeight / 2;
    zoomAt(x, y, gestureScale * e.scale);
  });
  document.addEventListener('gestureend', (e) => { e.preventDefault(); gestureScale = null; });

  window.addEventListener('resize', () => {
    if (touched) { keepInside(); apply(); } else fit();
  });

  // ---------- Lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-count');
  const btnPrev = document.getElementById('lb-prev');
  const btnNext = document.getElementById('lb-next');
  const btnClose = document.getElementById('lb-close');

  // Reihenfolge zum Blättern: zeilenweise von links oben nach rechts unten
  const order = (() => {
    const centers = items.map((it, i) => ({ i, x: it.x + S / 2, y: it.y + S / 2 })).sort((a, b) => a.y - b.y);
    const rows = [];
    for (const p of centers) {
      const row = rows[rows.length - 1];
      if (row && Math.abs(p.y - row.y) < S / 2) row.list.push(p);
      else rows.push({ y: p.y, list: [p] });
    }
    return rows.flatMap((r) => r.list.sort((a, b) => a.x - b.x).map((p) => p.i));
  })();

  let cur = -1;
  let token = 0;
  let lastFocus = null;

  function show() {
    const i = order[cur];
    const name = items[i].name;
    const thumb = tiles[i].firstChild;
    const ar = thumb.naturalWidth && thumb.naturalHeight ? thumb.naturalWidth / thumb.naturalHeight : 1;
    lb.style.setProperty('--ar', ar);
    lbImg.src = src('board', name);           // sofort sichtbar, liegt schon im Cache
    lbImg.alt = 'Foto ' + (cur + 1) + ' von ' + order.length;
    lbCount.textContent = (cur + 1) + ' / ' + order.length;
    const t = ++token;
    const big = new Image();
    big.onload = () => { if (t === token && cur >= 0) lbImg.src = big.src; };
    big.src = src('gross', name);
    for (const d of [1, -1]) {
      const j = order[(cur + d + order.length) % order.length];
      new Image().src = src('gross', items[j].name);
    }
  }

  function openLightbox(i) {
    cur = order.indexOf(i);
    if (cur < 0) return;
    lastFocus = document.activeElement;
    lb.hidden = false;
    show();
    requestAnimationFrame(() => lb.classList.add('open'));
    btnClose.focus({ preventScroll: true });
  }

  function closeLightbox() {
    if (lb.hidden) return;
    lb.classList.remove('open');
    lb.hidden = true;
    lbImg.removeAttribute('src');
    lbImg.style.transform = '';
    lbImg.style.opacity = '';
    cur = -1;
    token++;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  function step(d) {
    if (cur < 0) return;
    cur = (cur + d + order.length) % order.length;
    show();
  }

  btnPrev.addEventListener('click', () => step(-1));
  btnNext.addEventListener('click', () => step(1));
  btnClose.addEventListener('click', closeLightbox);

  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else return;
    e.preventDefault();
  });

  // Wischen zum Blättern, nach unten wischen schliesst, Tippen daneben schliesst
  let sw = null;
  lb.addEventListener('pointerdown', (e) => {
    if (sw || e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY, onImg: e.target === lbImg };
    try { lb.setPointerCapture(e.pointerId); } catch (_) {}
    lbImg.classList.remove('settle');
  });
  lb.addEventListener('pointermove', (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) >= Math.abs(dy)) {
      lbImg.style.transform = 'translateX(' + dx + 'px)';
      lbImg.style.opacity = '';
    } else if (dy > 0) {
      lbImg.style.transform = 'translateY(' + dy + 'px)';
      lbImg.style.opacity = String(Math.max(0.3, 1 - dy / 400));
    }
  });
  function swipeEnd(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    const onImg = sw.onImg;
    sw = null;
    lbImg.classList.add('settle');
    lbImg.style.transform = '';
    lbImg.style.opacity = '';
    if (e.type !== 'pointerup') return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (dy > 90 && dy > Math.abs(dx)) closeLightbox();
    else if (Math.hypot(dx, dy) < TAP && !onImg) closeLightbox();
  }
  lb.addEventListener('pointerup', swipeEnd);
  lb.addEventListener('pointercancel', swipeEnd);
  lb.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  fit();
  requestAnimationFrame(() => world.classList.add('ready'));
})();
</script>
</body>
</html>
