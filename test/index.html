<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta property="og:type" content="website">

<meta property="og:description" content="2 Fotos">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    overscroll-behavior: none;
    touch-action: none;
  }
  body {
    color: #eee;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: grab;
  }
  #stage.dragging, #stage.dragging .photo { cursor: grabbing; }
  #world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  #world.ready { opacity: 1; }
  .photo {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--size);
    height: var(--size);
    background: #111;
    cursor: zoom-in;
  }
  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .photo.missing img { visibility: hidden; }

  #nav {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    top: max(12px, env(safe-area-inset-top));
    z-index: 5;
    font-size: 14px;
  }
  #nav[hidden], #nav-list[hidden] { display: none; }
  #nav-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 24px);
    padding: 8px 12px 8px 14px;
    border: 0;
    border-radius: 999px;
    background: rgba(28, 28, 28, 0.78);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    color: #eee;
    font: inherit;
    cursor: pointer;
  }
  #nav-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nav-btn svg { flex: none; width: 16px; height: 16px; transition: transform 0.2s ease; }
  #nav-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  #nav-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #nav-list {
    width: min(320px, calc(100vw - 24px));
    max-height: min(70vh, 560px);
    margin-top: 8px;
    padding: 6px;
    overflow-y: auto;
    border-radius: 14px;
    background: rgba(22, 22, 22, 0.92);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  #nav-list a {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 12px;
    align-items: center;
    padding: 6px;
    border-radius: 10px;
    color: #eee;
    text-decoration: none;
  }
  #nav-list a:hover, #nav-list a:focus-visible { background: rgba(255, 255, 255, 0.08); outline: none; }
  #nav-list a[aria-current="page"] { background: rgba(255, 255, 255, 0.13); }
  #nav-list img {
    display: block;
    width: 96px;
    aspect-ratio: 1200 / 630;
    object-fit: cover;
    border-radius: 6px;
    background: #111;
  }
  #nav-list b { display: block; font-weight: 600; }
  #nav-list small { color: #9a9a9a; font-size: 12px; }

  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.94);
    touch-action: none;
    opacity: 0;
    transition: opacity 0.2s ease;
    --gx: clamp(12px, 6vw, 88px);
    --gy: clamp(12px, 5vh, 56px);
  }
  #lightbox[hidden] { display: none; }
  #lightbox.open { opacity: 1; }
  #lb-img {
    display: block;
    width: min(calc(100vw - 2 * var(--gx)), calc((100vh - 2 * var(--gy)) * var(--ar, 1)));
    width: min(calc(100vw - 2 * var(--gx)), calc((100dvh - 2 * var(--gy)) * var(--ar, 1)));
    height: auto;
    aspect-ratio: var(--ar, 1);
    object-fit: contain;
    -webkit-user-drag: none;
  }
  #lb-img.settle { transition: transform 0.2s ease, opacity 0.2s ease; }
  .lb-btn {
    position: absolute;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(32, 32, 32, 0.72);
    color: #fff;
    cursor: pointer;
  }
  .lb-btn:hover { background: rgba(64, 64, 64, 0.85); }
  .lb-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .lb-btn svg { width: 24px; height: 24px; }
  #lb-prev { left: max(8px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); }
  #lb-next { right: max(8px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); }
  #lb-close { right: max(8px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); }
  #lb-count {
    position: absolute;
    left: 50%;
    bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    color: #a8a8a8;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>

<nav id="nav" aria-label="Boards" hidden>
  <button id="nav-btn" type="button" aria-expanded="false" aria-controls="nav-list">
    <span id="nav-title"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div id="nav-list" hidden></div>
</nav>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto" hidden>
  <img id="lb-img" alt="">
  <button class="lb-btn" id="lb-prev" type="button" aria-label="Vorheriges Foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-btn" id="lb-next" type="button" aria-label="Nächstes Foto">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button class="lb-btn" id="lb-close" type="button" aria-label="Schliessen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div id="lb-count" aria-live="polite"></div>
</div>

<script id="fotoboard-data" type="application/json">{"version":2,"title":"Test","description":"","slug":"test","size":300,"items":[{"name":"_DSC2247.jpeg","x":1040,"y":-480,"rot":0,"z":1},{"name":"_DSC2258.jpeg","x":1360,"y":-480,"rot":0,"z":2}],"boards":[{"slug":"","title":"Fotoboard","count":40},{"slug":"test","title":"Test","count":2}]}</script>
<script>
(() => {
  'use strict';
  const DATA = JSON.parse(document.getElementById('fotoboard-data').textContent);

  const S = DATA.size || 300;
  const SLUG = DATA.slug || '';
  const BASE = SLUG ? '../' : '';
  const items = DATA.items.slice().sort((a, b) => a.z - b.z);
  const TAP = 8;            // ab so vielen Pixeln gilt ein Druck als Ziehen
  const MAX_SCALE = 4;
  // Versionen der Fotos: beim Hineinzoomen wird die nächstgrössere geladen
  const LEVELS = [['board', 500], ['mittel', 1000], ['gross', 2000]];

  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const src = (dir, name) => BASE + 'fotos/' + dir + '/' + encodeURIComponent(name);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  world.style.setProperty('--size', S + 'px');

  const tiles = items.map((it, i) => {
    const tile = document.createElement('div');
    tile.className = 'photo';
    tile.dataset.i = i;
    tile.style.transform = 'translate(' + it.x + 'px, ' + it.y + 'px) rotate(' + (it.rot || 0) + 'deg)';
    tile.style.zIndex = i + 1;
    const img = document.createElement('img');
    img.alt = '';
    img.draggable = false;
    img.decoding = 'async';
    img.addEventListener('error', () => tile.classList.add('missing'), { once: true });
    img.src = src('board', it.name);
    tile.append(img);
    world.append(tile);
    return tile;
  });

  // Umriss jedes Fotos und des ganzen Boards, gedrehte Fotos mitgerechnet
  const boxes = items.map((it) => {
    const r = (it.rot || 0) * Math.PI / 180;
    const h = S / 2 * (Math.abs(Math.cos(r)) + Math.abs(Math.sin(r)));
    const cx = it.x + S / 2, cy = it.y + S / 2;
    return { l: cx - h, t: cy - h, r: cx + h, b: cy + h };
  });
  const box = boxes.length ? {
    minX: Math.min(...boxes.map((b) => b.l)),
    minY: Math.min(...boxes.map((b) => b.t)),
    maxX: Math.max(...boxes.map((b) => b.r)),
    maxY: Math.max(...boxes.map((b) => b.b)),
  } : { minX: 0, minY: 0, maxX: S, maxY: S };

  // ---------- Ansicht: verschieben und zoomen ----------
  const view = { x: 0, y: 0, s: 1 };
  let minScale = 0.05;
  let touched = false;

  function apply() {
    world.style.transform = 'translate(' + view.x + 'px, ' + view.y + 'px) scale(' + view.s + ')';
    scheduleSharp();
  }

  // Die Bildschirmmitte bleibt immer über dem Board, so geht es nie verloren.
  function keepInside() {
    const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2;
    view.x = clamp(view.x, cx - box.maxX * view.s, cx - box.minX * view.s);
    view.y = clamp(view.y, cy - box.maxY * view.s, cy - box.minY * view.s);
  }

  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight;
    const pad = Math.round(Math.min(w, h) * 0.04) + 12;
    const bw = box.maxX - box.minX, bh = box.maxY - box.minY;
    const s = Math.min((w - 2 * pad) / bw, (h - 2 * pad) / bh, 2);
    minScale = Math.min(s * 0.5, 1);
    view.s = s;
    view.x = (w - bw * s) / 2 - box.minX * s;
    view.y = (h - bh * s) / 2 - box.minY * s;
    apply();
  }

  function zoomAt(cx, cy, s) {
    s = clamp(s, minScale, MAX_SCALE);
    const k = s / view.s;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.s = s;
    keepInside();
    apply();
  }

  // ---------- Scharf beim Hineinzoomen ----------
  const sharp = items.map(() => ({ level: 0, want: 0, broken: {} }));
  let sharpTimer = 0;

  function scheduleSharp() {
    clearTimeout(sharpTimer);
    sharpTimer = setTimeout(updateSharp, 160);
  }

  function updateSharp() {
    const px = S * view.s * (window.devicePixelRatio || 1);
    const need = px > LEVELS[1][1] * 1.15 ? 2 : px > LEVELS[0][1] * 1.15 ? 1 : 0;
    const w = stage.clientWidth, h = stage.clientHeight;
    const wx = (sx) => (sx - view.x) / view.s, wy = (sy) => (sy - view.y) / view.s;
    // nah: wird scharf geladen; weit weg: zurück auf die kleine Version
    const near = { l: wx(-w * 0.25), r: wx(w * 1.25), t: wy(-h * 0.25), b: wy(h * 1.25) };
    const far = { l: wx(-w), r: wx(2 * w), t: wy(-h), b: wy(2 * h) };
    const hits = (b, a) => b.r > a.l && b.l < a.r && b.b > a.t && b.t < a.b;
    boxes.forEach((b, i) => {
      if (tiles[i].classList.contains('missing')) return;
      let level = sharp[i].want;
      if (hits(b, near)) level = need;
      else if (!hits(b, far)) level = 0;
      else level = Math.min(level, need);
      setLevel(i, level);
    });
  }

  function setLevel(i, level) {
    const st = sharp[i];
    while (level > 0 && st.broken[level]) level--;   // fehlt eine Version, die kleinere nehmen
    if (level === st.want) return;
    st.want = level;
    const img = tiles[i].firstChild;
    const url = src(LEVELS[level][0], items[i].name);
    if (level === 0) { img.src = url; st.level = 0; return; }
    const pre = new Image();
    pre.decoding = 'async';
    pre.src = url;
    const loaded = pre.decode ? pre.decode() : new Promise((ok, fail) => { pre.onload = ok; pre.onerror = fail; });
    loaded.then(() => {
      if (st.want === level) { img.src = url; st.level = level; }
    }, () => {
      st.broken[level] = true;
      if (st.want === level) { st.want = -1; setLevel(i, level - 1); }
    });
  }

  // ---------- Ziehen, Pinch, Mausrad ----------
  const pts = new Map();
  let g = null;

  function startPinch() {
    const [a, b] = [...pts.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    g = {
      type: 'pinch',
      d0: Math.hypot(b.x - a.x, b.y - a.y) || 1,
      s0: view.s,
      wx: (mx - view.x) / view.s,
      wy: (my - view.y) / view.s,
    };
  }

  function startPan(id, x, y, moved, photo) {
    g = { type: 'pan', id, sx: x, sy: y, vx: view.x, vy: view.y, moved, photo };
  }

  stage.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    touched = true;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) {
      const tile = e.target.closest('.photo');
      startPan(e.pointerId, e.clientX, e.clientY, false, tile ? +tile.dataset.i : -1);
    } else if (pts.size === 2) {
      startPinch();
    }
  });

  stage.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId);
    if (!p || !g) return;
    p.x = e.clientX;
    p.y = e.clientY;
    if (g.type === 'pan' && e.pointerId === g.id) {
      const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
      if (!g.moved && Math.hypot(dx, dy) < TAP) return;
      if (!g.moved) { g.moved = true; stage.classList.add('dragging'); }
      view.x = g.vx + dx;
      view.y = g.vy + dy;
      keepInside();
      apply();
    } else if (g.type === 'pinch' && pts.size >= 2) {
      const [a, b] = [...pts.values()];
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const s = clamp(g.s0 * Math.hypot(b.x - a.x, b.y - a.y) / g.d0, minScale, MAX_SCALE);
      view.s = s;
      view.x = mx - g.wx * s;
      view.y = my - g.wy * s;
      keepInside();
      apply();
    }
  });

  function pointerEnd(e) {
    if (!pts.delete(e.pointerId) || !g) return;
    if (g.type === 'pan' && g.id === e.pointerId) {
      if (!g.moved && e.type === 'pointerup' && g.photo >= 0) openLightbox(g.photo);
      stage.classList.remove('dragging');
      g = null;
    } else if (g.type === 'pinch') {
      if (pts.size >= 2) startPinch();
      else if (pts.size === 1) {
        const [[id, p]] = pts;
        startPan(id, p.x, p.y, true, -1);
      } else g = null;
    }
  }
  stage.addEventListener('pointerup', pointerEnd);
  stage.addEventListener('pointercancel', pointerEnd);

  // Mausrad und Trackpad. Pinch auf dem Trackpad kommt als Rad mit ctrlKey.
  let gestureScale = null;
  stage.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey && gestureScale !== null) return;
    touched = true;
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? stage.clientHeight : 1;
    const k = e.ctrlKey ? 0.01 : 0.002;
    zoomAt(e.clientX, e.clientY, view.s * Math.exp(-e.deltaY * unit * k));
  }, { passive: false });

  // Seitenzoom überall verhindern (Strg+Rad, Safari-Gesten)
  window.addEventListener('wheel', (e) => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => {
    e.preventDefault();
    gestureScale = pts.size < 2 && lb.hidden ? view.s : null;
  });
  document.addEventListener('gesturechange', (e) => {
    e.preventDefault();
    if (gestureScale === null || pts.size >= 2) return;
    touched = true;
    const x = e.clientX ?? stage.clientWidth / 2, y = e.clientY ?? stage.clientHeight / 2;
    zoomAt(x, y, gestureScale * e.scale);
  });
  document.addEventListener('gestureend', (e) => { e.preventDefault(); gestureScale = null; });

  window.addEventListener('resize', () => {
    if (touched) { keepInside(); apply(); } else fit();
  });

  // ---------- Andere Boards ----------
  const nav = document.getElementById('nav');
  const navBtn = document.getElementById('nav-btn');
  const navList = document.getElementById('nav-list');
  const boards = Array.isArray(DATA.boards) ? DATA.boards : [];

  function link(slug, file) {
    const dir = BASE + (slug ? encodeURIComponent(slug) + '/' : '');
    return (dir || './') + (file || '');
  }

  function toggleNav(open) {
    open = open ?? navList.hidden;
    navList.hidden = !open;
    navBtn.setAttribute('aria-expanded', String(open));
  }

  if (boards.length > 1) {
    nav.hidden = false;
    document.getElementById('nav-title').textContent = DATA.title || 'Fotoboard';
    for (const b of boards) {
      const a = document.createElement('a');
      a.href = link(b.slug);
      if ((b.slug || '') === SLUG) a.setAttribute('aria-current', 'page');
      const img = document.createElement('img');
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => { img.style.visibility = 'hidden'; }, { once: true });
      img.src = link(b.slug, 'vorschau.jpg');
      const text = document.createElement('span');
      const title = document.createElement('b');
      title.textContent = b.title || 'Fotoboard';
      const count = document.createElement('small');
      count.textContent = b.count === 1 ? '1 Foto' : (b.count || 0) + ' Fotos';
      text.append(title, count);
      a.append(img, text);
      navList.append(a);
    }
    navBtn.addEventListener('click', () => toggleNav());
    document.addEventListener('pointerdown', (e) => {
      if (!navList.hidden && !nav.contains(e.target)) toggleNav(false);
    }, true);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !navList.hidden) { toggleNav(false); navBtn.focus(); }
    });
  }

  // ---------- Lightbox ----------
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-count');
  const btnPrev = document.getElementById('lb-prev');
  const btnNext = document.getElementById('lb-next');
  const btnClose = document.getElementById('lb-close');

  // Reihenfolge zum Blättern: zeilenweise von links oben nach rechts unten
  const order = (() => {
    const centers = items.map((it, i) => ({ i, x: it.x + S / 2, y: it.y + S / 2 })).sort((a, b) => a.y - b.y);
    const rows = [];
    for (const p of centers) {
      const row = rows[rows.length - 1];
      if (row && Math.abs(p.y - row.y) < S / 2) row.list.push(p);
      else rows.push({ y: p.y, list: [p] });
    }
    return rows.flatMap((r) => r.list.sort((a, b) => a.x - b.x).map((p) => p.i));
  })();

  let cur = -1;
  let token = 0;
  let lastFocus = null;

  function show() {
    const i = order[cur];
    const name = items[i].name;
    const thumb = tiles[i].firstChild;
    const ar = thumb.naturalWidth && thumb.naturalHeight ? thumb.naturalWidth / thumb.naturalHeight : 1;
    lb.style.setProperty('--ar', ar);
    lbImg.src = thumb.getAttribute('src') || src('board', name);   // sofort sichtbar, liegt schon im Cache
    lbImg.alt = 'Foto ' + (cur + 1) + ' von ' + order.length;
    lbCount.textContent = (cur + 1) + ' / ' + order.length;
    const t = ++token;
    const big = new Image();
    big.onload = () => { if (t === token && cur >= 0) lbImg.src = big.src; };
    big.src = src('gross', name);
    for (const d of [1, -1]) {
      const j = order[(cur + d + order.length) % order.length];
      new Image().src = src('gross', items[j].name);
    }
  }

  function openLightbox(i) {
    cur = order.indexOf(i);
    if (cur < 0) return;
    toggleNav(false);
    lastFocus = document.activeElement;
    lb.hidden = false;
    show();
    requestAnimationFrame(() => lb.classList.add('open'));
    btnClose.focus({ preventScroll: true });
  }

  function closeLightbox() {
    if (lb.hidden) return;
    lb.classList.remove('open');
    lb.hidden = true;
    lbImg.removeAttribute('src');
    lbImg.style.transform = '';
    lbImg.style.opacity = '';
    cur = -1;
    token++;
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }

  function step(d) {
    if (cur < 0) return;
    cur = (cur + d + order.length) % order.length;
    show();
  }

  btnPrev.addEventListener('click', () => step(-1));
  btnNext.addEventListener('click', () => step(1));
  btnClose.addEventListener('click', closeLightbox);

  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else return;
    e.preventDefault();
  });

  // Wischen zum Blättern, nach unten wischen schliesst, Tippen daneben schliesst
  let sw = null;
  lb.addEventListener('pointerdown', (e) => {
    if (sw || e.target.closest('button')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    sw = { id: e.pointerId, x: e.clientX, y: e.clientY, onImg: e.target === lbImg };
    try { lb.setPointerCapture(e.pointerId); } catch (_) {}
    lbImg.classList.remove('settle');
  });
  lb.addEventListener('pointermove', (e) => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.abs(dx) >= Math.abs(dy)) {
      lbImg.style.transform = 'translateX(' + dx + 'px)';
      lbImg.style.opacity = '';
    } else if (dy > 0) {
      lbImg.style.transform = 'translateY(' + dy + 'px)';
      lbImg.style.opacity = String(Math.max(0.3, 1 - dy / 400));
    }
  });
  function swipeEnd(e) {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    const onImg = sw.onImg;
    sw = null;
    lbImg.classList.add('settle');
    lbImg.style.transform = '';
    lbImg.style.opacity = '';
    if (e.type !== 'pointerup') return;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    else if (dy > 90 && dy > Math.abs(dx)) closeLightbox();
    else if (Math.hypot(dx, dy) < TAP && !onImg) closeLightbox();
  }
  lb.addEventListener('pointerup', swipeEnd);
  lb.addEventListener('pointercancel', swipeEnd);
  lb.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  fit();
  requestAnimationFrame(() => world.classList.add('ready'));
})();
</script>
</body>
</html>
